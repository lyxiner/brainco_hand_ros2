hardware:
  slave_id: 1
  log_level: info

  # Auto-detection replaces the port, baud rate and slave ID with detected values.
  port: /dev/ttyUSB0
  baudrate: 115200
  auto_detect: true
  auto_detect_quick: true
  auto_detect_port: /dev/ttyUSB0

  # Revo1 range: 100~1500 mA; factory default is 500 mA.
  index_protected_current_ma: 650

  # SDK motor order: thumb flexion, thumb abduction, index, middle, ring, pinky.
  # Values are the Revo1 active-joint limits in radians: 55, 90, 70, 70, 70, 70 deg.
  joint_max_positions_rad: "0.9599310886,1.5707963268,1.2217304764,1.2217304764,1.2217304764,1.2217304764"
